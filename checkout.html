<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CareNest | Checkout</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><header class="site-header"><a class="brand" href="doctors.html">Care<span>Nest</span></a><nav><a href="doctors.html">Find doctors</a><a href="my-bookings.html">My bookings</a><button class="text-button" data-logout>Log out</button></nav></header><main class="page-shell checkout-layout"><section><p class="eyebrow">Final step</p><h1>Confirm your booking</h1><div id="checkout-summary" class="summary-card"></div></section><aside class="payment-card"><h2>Patient & payment</h2><fieldset><legend>Booking for</legend><label class="radio-row"><input type="radio" name="patient-type" value="self" checked> Booking for myself</label><label class="radio-row"><input type="radio" name="patient-type" value="other"> Booking for someone else</label></fieldset><div id="other-patient-fields" class="is-hidden"><label>Patient full name<input id="patient-name" type="text" maxlength="50" placeholder="Full name"><small class="field-error" data-checkout-error="patient-name"></small></label><label>Patient phone<input id="patient-phone" type="tel" inputmode="numeric" placeholder="010XXXXXXXX"><small class="field-error" data-checkout-error="patient-phone"></small></label></div><label>Promo code<div class="inline-control"><input id="promo-code" maxlength="10" pattern="[A-Za-z0-9]*" placeholder="Optional code"><button id="apply-promo" class="button button--outline" type="button">Apply</button></div></label><p id="promo-message" class="form-message" aria-live="polite"></p><fieldset><legend>Payment method</legend><label class="radio-row"><input type="radio" name="payment" value="cash" checked> Pay at clinic (Cash)</label><label class="radio-row"><input type="radio" name="payment" value="card"> Credit card</label></fieldset><div id="card-fields" class="is-hidden"><label>Card number<input id="card-number" type="text" inputmode="numeric" maxlength="16" placeholder="16-digit card number"><small class="field-error" data-checkout-error="card-number"></small></label><label>Expiry date<input id="card-expiry" type="text" inputmode="numeric" maxlength="5" placeholder="MM/YY"><small class="field-error" data-checkout-error="card-expiry"></small></label><label>CVV<input id="card-cvv" type="text" inputmode="numeric" maxlength="3" placeholder="3-digit CVV"><small class="field-error" data-checkout-error="card-cvv"></small></label></div><p id="checkout-message" class="form-message" aria-live="polite"></p><button id="confirm-booking" class="button button--primary" type="button">Confirm appointment</button></aside></main><div id="confirmation-modal" class="modal is-hidden" role="dialog" aria-modal="true"><div class="modal__content"><div class="success-icon">✓</div><h2>Appointment confirmed!</h2><div id="receipt-details" class="receipt-details"></div><a class="button button--primary" href="my-bookings.html">View my bookings</a></div></div><script src="assets/js/data.js"></script><script src="assets/js/main.js"></script></body></html>
